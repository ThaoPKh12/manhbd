<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mừng sinh nhật Manh 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root{
    --bg1:#f6eedf; --bg2:#efe2cc;
    --olive:#b0a27e; --olive-dk:#8a7d5a;
    --cream:#fbf2df; --paper:#fdf7ea;
    --mocha:#5a4434; --pink:#e9b8ae;
    --card-w: min(80vw, calc(74vh * 0.689), 470px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:var(--mocha);
    background:
      radial-gradient(circle at 20% 15%, #fff4f6 0, transparent 50%),
      radial-gradient(circle at 85% 85%, #f6cfd6 0, transparent 45%),
      linear-gradient(160deg,#fde7ec,#f9d8df);
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- confetti ---------- */
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .bit{
    position:absolute;top:-6vh;
    width:var(--w);height:var(--h);
    background:var(--c);border-radius:var(--r);
    opacity:.85;
    animation:fall var(--dur) linear forwards;
  }
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotate(0deg)}
    100%{transform:translate3d(var(--drift),112vh,0) rotate(var(--rot))}
  }

  /* ---------- envelope stage ---------- */
  #envStage{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:28px;
    transition:opacity .6s ease, transform .6s ease;
  }
  #envStage.gone{opacity:0;transform:translateY(30px) scale(.95);pointer-events:none}
  .envelope{
    position:relative;
    width:min(80vw,420px);aspect-ratio:1.5/1;
    cursor:pointer;
    animation:bob 3.2s ease-in-out infinite;
    filter:drop-shadow(0 16px 26px rgba(150,95,105,.22));
  }
  .envelope:hover{animation-play-state:paused}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .envelope svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .env-back{z-index:1}
  .env-letter{
    position:absolute;left:7%;right:7%;top:6%;bottom:5%;z-index:2;
    background:#fffdf8;border-radius:4px;
    border:1.5px solid #d9cfba;
    transition:transform .8s cubic-bezier(.3,.7,.3,1) .35s;
    display:flex;align-items:flex-start;justify-content:center;padding-top:9%;
    font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(20px,5.4vw,28px);color:#c7786a;
  }
  .env-front{z-index:3;pointer-events:none}
  .env-flap{
    position:absolute;inset:0;z-index:4;
    transform-origin:top center;
    transition:transform .6s ease, z-index 0s .3s;
  }
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
  .envelope.open .env-letter{transform:translateY(-52%)}
  .envelope.open{animation:none}

  .prompt{
    font-weight:600;font-size:clamp(16px,4.4vw,20px);
    color:var(--mocha);letter-spacing:.2px;
    padding:10px 22px;border-radius:999px;
    background:rgba(255,250,240,.75);
    box-shadow:0 4px 14px rgba(90,68,52,.12);
    cursor:pointer;border:none;font-family:inherit;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* ---------- postcard stage ---------- */
  #cardStage{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,2.6vh,24px);
    opacity:0;pointer-events:none;
  }
  #cardStage.show{opacity:1;pointer-events:auto}
  .scene{
    width:var(--card-w);aspect-ratio:1100/1596;
    perspective:1600px;
    opacity:0;transform:translateY(40px) scale(.85);
  }
  #cardStage.show .scene{animation:arrive .9s cubic-bezier(.2,.8,.25,1.1) forwards}
  @keyframes arrive{to{opacity:1;transform:none}}
  .card{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.45,.05,.25,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:14px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 22px 50px rgba(90,68,52,.28), 0 4px 10px rgba(90,68,52,.12);
  }
  .front img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
  .back{
    transform:rotateY(180deg);
    background:var(--olive);
    padding:9.2% 9.5%;
    container-type:inline-size;
  }
  .paper{
    position:relative;width:100%;height:100%;
    background:
      radial-gradient(circle at 20% 10%, #fffaf0 0, transparent 55%),
      var(--paper);
    border-radius:4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:10cqw 9cqw;
    gap:5cqw;
  }
  .paper::before{ /* thin inner dashed frame */
    content:"";position:absolute;inset:3.2cqw;
    border:1.5px dashed rgba(176,162,126,.6);border-radius:3px;pointer-events:none;
  }
  .flower{font-size:7cqw;line-height:1;color:#e8b93a}
  .greet{
    font-family:'Dancing Script',cursive;font-weight:700;
    font-size:11cqw;line-height:1.15;color:#c7786a;
  }
  .wish{
    font-size:5.5cqw;line-height:1.7;font-weight:500;color:var(--mocha);
    text-wrap:pretty;
  }
  .wish span{display:block;margin-top:3.2cqw}

  .hint{
    font-weight:600;font-size:clamp(14px,3.8vw,17px);color:var(--mocha);
    background:rgba(255,250,240,.78);border:none;font-family:inherit;
    padding:8px 20px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 12px rgba(90,68,52,.12);
    display:flex;align-items:center;gap:8px;
    opacity:0;
  }
  #cardStage.show .hint{animation:fadeUp .6s ease .8s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hint .ico{display:inline-block;transition:transform .6s ease}
  .hint:hover .ico{transform:rotate(180deg)}

  @media (prefers-reduced-motion: reduce){
    .envelope,.prompt{animation:none}
    .card{transition-duration:.01s}
  }
</style>
</head>
<body>

<div id="confetti"></div>

<!-- Envelope -->
<div id="envStage">
  <div class="envelope" id="envelope" role="button" aria-label="Mở thư">
    <svg class="env-back" viewBox="0 0 600 400" preserveAspectRatio="none">
      <rect x="1.5" y="1.5" width="597" height="397" rx="12" fill="#fbf7ef" stroke="#8c8063" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="env-letter">Gửi Manh</div>
    <svg class="env-front" viewBox="0 0 600 400" preserveAspectRatio="none">
      <path d="M1.5 6 L300 226 L598.5 6 L598.5 386 Q598.5 398.5 586 398.5 L14 398.5 Q1.5 398.5 1.5 386 Z" fill="#fbf7ef"/>
      <path d="M1.5 6 L1.5 386 Q1.5 398.5 14 398.5 L586 398.5 Q598.5 398.5 598.5 386 L598.5 6" fill="none" stroke="#8c8063" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="12" y1="390" x2="242" y2="198" stroke="#c9bfab" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      <line x1="588" y1="390" x2="358" y2="198" stroke="#c9bfab" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
    </svg>
    <svg class="env-flap" viewBox="0 0 600 400" preserveAspectRatio="none">
      <path d="M8 6 L300 226 L592 6" fill="#fbf7ef" stroke="#8c8063" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>
  <button class="prompt" id="openBtn">Hehe ấn vào đây để mở</button>
</div>

      <div class="face back">
        <div class="paper">
          <div class="flower">✿</div>
          <div class="greet">Chút mừn sin nhật Manhhh!</div>
          <p class="wish">
            Chúc Manh tuổi mới xinh điẹp, học hành hanh thông, công việc thuận lợi và có nhìuuu trải nghiệm mới!!!
            <span>Chúc Manh luôn vui vẻ, luôn nhiều năng lượng và mọi điều như ý nhe hêhhehe!!!</span>
          </p>
        </div>
      </div>
    </div>
  </div>
  <button class="hint" id="flipBtn"><span class="ico">↻</span> Ấn để xoay thiệp</button>
</div>

<script>
  const PASTELS = ['#f7c6c7','#fbe3b4','#c9e4c5','#c6dcf2','#e2cdf1','#fde2e4','#fff1b6','#d6efe6','#f9d5bb'];
  const layer = document.getElementById('confetti');

  function spawnBit(){
    const b = document.createElement('div');
    b.className = 'bit';
    const size = 6 + Math.random()*7;
    const shape = Math.random();
    b.style.setProperty('--w', size + 'px');
    b.style.setProperty('--h', (shape < .4 ? size : size*0.45) + 'px');
    b.style.setProperty('--r', shape < .4 ? '50%' : '2px');
    b.style.setProperty('--c', PASTELS[Math.floor(Math.random()*PASTELS.length)]);
    b.style.setProperty('--dur', (6 + Math.random()*5) + 's');
    b.style.setProperty('--drift', (Math.random()*160 - 80) + 'px');
    b.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    b.style.left = Math.random()*100 + 'vw';
    layer.appendChild(b);
    b.addEventListener('animationend', () => b.remove());
  }

  function launchConfetti(){
    // a soft first burst, then a gentle continuous drizzle
    for (let i = 0; i < 40; i++) setTimeout(spawnBit, i*45);
    setInterval(spawnBit, 260);
  }

  const envelope = document.getElementById('envelope');
  const envStage = document.getElementById('envStage');
  const cardStage = document.getElementById('cardStage');
  const card = document.getElementById('card');
  let opened = false;

  function openLetter(){
    if (opened) return;
    opened = true;
    envelope.classList.add('open');
    setTimeout(() => envStage.classList.add('gone'), 1300);
    setTimeout(() => {
      envStage.style.display = 'none';
      cardStage.classList.add('show');
      launchConfetti();
    }, 1850);
  }
  envelope.addEventListener('click', openLetter);
  document.getElementById('openBtn').addEventListener('click', openLetter);

  const flip = () => card.classList.toggle('flipped');
  card.addEventListener('click', flip);
  document.getElementById('flipBtn').addEventListener('click', flip);
</script>
